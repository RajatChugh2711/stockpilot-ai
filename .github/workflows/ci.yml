name: CI

on:
  push:
    branches: [main, develop, "chore/**", "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  web-and-api:
    name: Web, API and database checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stockpilot
          POSTGRES_USER: stockpilot
          POSTGRES_PASSWORD: stockpilot_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockpilot -d stockpilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://stockpilot:stockpilot_dev_only@localhost:5432/stockpilot?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Apply migrations to temporary PostgreSQL
        run: pnpm db:migrate:deploy
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  analytics:
    name: Analytics service checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/analytics/requirements.txt
      - name: Import application
        working-directory: apps/analytics
        run: python -c "from app.main import app; print(app.title)"
